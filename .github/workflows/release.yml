# Build and publish the connector image.
#
# WHY THIS EXISTS
# ---------------
# The image was published by hand. Between 2026-05-11 and 2026-09-04 `main`
# gained a currency fix, settlement, gift cards and a payment page, and none of
# it reached a merchant — `payramapp/payram-shopify:latest` still served the
# older build. Merging did not ship anything, and nothing said so.
#
# TAGGING
# -------
# Mirrors payramapp/payram so both images can be pinned the same way:
#   sha-<short>   every build, immutable — the tag to pin in production
#   <version>     on a v* tag, plus the major.minor ladder
#   latest        main only
#
# The installer hardcodes `:latest`, so a merchant re-running it silently takes
# whatever was last pushed. `sha-` tags give them something stable to pin to,
# and give us something to roll back to.
name: Release image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # write: v* builds also publish a GitHub Release, which is what the
      # connector's in-app update notice reads.
      contents: write

    env:
      DOCKER_IMAGE: payramapp/payram-shopify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail here, loudly, rather than at `docker login` with an opaque error.
      # These secrets exist on payram-core but are repo-scoped, so they must be
      # added to this repository too.
      - name: Check publishing credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not set on this repository."
            echo "::error::Add them under Settings → Secrets and variables → Actions."
            echo "::error::payram-core already has them; they are repo-scoped, not org-wide."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # arm64 is included because self-hosted merchants commonly run on ARM VPS
      # (Ampere, Oracle free tier). Without it `docker pull` on those hosts
      # either fails or silently runs emulated.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Readable from inside the running container, unlike the OCI labels.
          # APP_VERSION comes from the TAG, never from metadata-action's `version`
          # output: on a main build that output resolves to the literal "latest"
          # (the raw tag outranks the sha tag), which would stamp every merchant's
          # image PAYRAM_VERSION=latest and make the update banner nag forever.
          # Untagged builds ship no version, and the app then stays silent.
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A tagged build is a release merchants are told about in-app, so publish
      # the notes they will read. Mark the release body with [installer-required]
      # when the checkout extension or the permission list changed — the connector
      # then tells merchants to re-run the installer instead of just pulling the
      # image, which a plain `docker pull` would silently leave stale.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The annotated tag's message becomes the top of the release body, so a
          # releaser writes [installer-required] there when the checkout extension
          # or the permission list changed. --generate-notes alone is machine-written
          # and could never carry that marker, which would leave the connector
          # telling merchants "server only" for a release that is not.
          TAG_BODY="$(git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}")"
          SUBJECT="$(git tag -l --format='%(contents:subject)' "${GITHUB_REF_NAME}")"
          NOTES="${SUBJECT}"$'\n\n'"${TAG_BODY}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "${NOTES}" \
            --generate-notes \
            --verify-tag

      - name: Summary
        run: |
          {
            echo "### Published \`${DOCKER_IMAGE}\`"
            echo ""
            echo "Commit \`${GITHUB_SHA::7}\` · platforms \`linux/amd64, linux/arm64\`"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Pin the \`sha-\` tag in production; \`latest\` moves."
          } >> "$GITHUB_STEP_SUMMARY"
