# Build and publish the connector image.
#
# WHY THIS EXISTS
# ---------------
# The image was published by hand. Between 2026-05-11 and 2026-09-04 `main`
# gained a currency fix, settlement, gift cards and a payment page, and none of
# it reached a merchant — `payramapp/payram-shopify:latest` still served the
# older build. Merging did not ship anything, and nothing said so.
#
# TAGGING
# -------
# Mirrors payramapp/payram so both images can be pinned the same way:
#   sha-<short>   main and dispatched builds, immutable — the tag to pin in
#                 production. A v* run does not republish it: it rebuilds the
#                 same commit with APP_VERSION set, which would swap the image
#                 behind a tag someone pinned.
#   <version>     on a v* tag, plus the major.minor ladder
#   latest        main only (metadata-action would add it to every v* run by
#                 default, so re-running an old release could move it back)
#
# The installer hardcodes `:latest`, so a merchant re-running it silently takes
# whatever was last pushed. `sha-` tags give them something stable to pin to,
# and give us something to roll back to.
#
# NATIVE RUNNERS, NO EMULATION
# ----------------------------
# Each platform builds on its own hardware and pushes an untagged image by
# digest; `publish` then puts both digests under the tags above. Building arm64
# under QEMU on an amd64 runner broke on Node 26: `prisma generate` read a
# corrupted schema JSON at a different offset on every run (2026-10-26, run
# 40279546824), so `main` merged and nothing was published.
name: Release image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Jobs that need more ask for it; everything else, the reusable test workflow
# included, only reads.
permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          # arm64 is included because self-hosted merchants commonly run on ARM
          # VPS (Ampere, Oracle free tier). Without it `docker pull` on those
          # hosts either fails or silently runs emulated.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    env:
      DOCKER_IMAGE: payramapp/payram-shopify
      PLATFORM: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Fail here, loudly, rather than at `docker login` with an opaque error.
      # These secrets exist on payram-core but are repo-scoped, so they must be
      # added to this repository too.
      - name: Check publishing credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not set on this repository."
            echo "::error::Add them under Settings → Secrets and variables → Actions."
            echo "::error::payram-core already has them; they are repo-scoped, not org-wide."
            exit 1
          fi

      # linux/arm64 -> linux-arm64: names this platform's cache and artifact.
      - name: Name the platform
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Labels only; the tags are applied once, in `publish`.
      - name: Derive labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.DOCKER_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Readable from inside the running container, unlike the OCI labels.
          # APP_VERSION comes from the TAG, never from metadata-action's `version`
          # output: on a main build that output resolves to the literal "latest"
          # (the raw tag outranks the sha tag), which would stamp every merchant's
          # image PAYRAM_VERSION=latest and make the update banner nag forever.
          # Untagged builds ship no version, and the app then stays silent.
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || '' }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      # write: v* builds also publish a GitHub Release, which is what the
      # connector's in-app update notice reads.
      contents: write

    env:
      DOCKER_IMAGE: payramapp/payram-shopify

    steps:
      # For the annotated tag's message in "Publish GitHub Release"; `gh` there
      # authenticates with GH_TOKEN, so the checkout keeps no credential.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short,enable=${{ github.ref_type != 'tag' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Tag both platforms
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          tags=()
          while IFS= read -r tag; do tags+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("${DOCKER_IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      # The tags above can only be right if both platforms made it; a merchant on
      # ARM pulling an amd64-only `latest` gets "exec format error".
      - name: Check both platforms are published
        run: |
          set -euo pipefail
          while IFS= read -r ref; do
            # Attestation manifests carry the platform unknown/unknown; skip them.
            platforms="$(docker buildx imagetools inspect "$ref" --raw \
              | jq -r '[.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | join(" ")')"
            echo "$ref: $platforms"
            for want in linux/amd64 linux/arm64; do
              case " $platforms " in
                *" $want "*) ;;
                *) echo "::error::$ref is missing $want"; exit 1 ;;
              esac
            done
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

      # A tagged build is a release merchants are told about in-app, so publish
      # the notes they will read. Mark the release body with [installer-required]
      # when the checkout extension or the permission list changed — the connector
      # then tells merchants to re-run the installer instead of just pulling the
      # image, which a plain `docker pull` would silently leave stale.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The annotated tag's message becomes the top of the release body, so a
          # releaser writes [installer-required] there when the checkout extension
          # or the permission list changed. --generate-notes alone is machine-written
          # and could never carry that marker, which would leave the connector
          # telling merchants "server only" for a release that is not.
          TAG_BODY="$(git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}")"
          SUBJECT="$(git tag -l --format='%(contents:subject)' "${GITHUB_REF_NAME}")"
          NOTES="${SUBJECT}"$'\n\n'"${TAG_BODY}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "${NOTES}" \
            --generate-notes \
            --verify-tag

      - name: Summary
        run: |
          {
            echo "### Published \`${DOCKER_IMAGE}\`"
            echo ""
            echo "Commit \`${GITHUB_SHA::7}\` · platforms \`linux/amd64, linux/arm64\`"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Pin the \`sha-\` tag in production; \`latest\` moves."
          } >> "$GITHUB_STEP_SUMMARY"
